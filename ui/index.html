<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CatPad</title>
<style>
  :root {
    --ink: #000000;
    --ink-3: #6E6E73;
    --line: rgba(0, 0, 0, .14);
    --line-strong: rgba(0, 0, 0, .26);
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  html { background: transparent; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI Variable Text",
                 "Segoe UI", -apple-system, sans-serif;
    color: var(--ink);
    /* 70% transparent panel — the desktop shows through, blurred */
    background: linear-gradient(180deg, rgba(251, 251, 253, .32) 0%,
                                        rgba(238, 238, 243, .30) 100%);
    display: flex; flex-direction: column;
    cursor: default;
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center;
    padding: 9px 10px 6px 12px;
    animation: rise .3s ease both;
  }
  .drag { flex: 1; display: flex; align-items: center; height: 20px; }
  .title { font-size: 11.5px; font-weight: 600; letter-spacing: -.1px; }
  .dots { display: flex; gap: 6px; padding-left: 8px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: .5px solid rgba(0, 0, 0, .15);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: rgba(0, 0, 0, 0);
    cursor: pointer; transition: color .1s;
  }
  .dot.min   { background: #FEBC2E; }
  .dot.close { background: #FF5F57; }
  .dots:hover .dot.min   { color: #985712; }
  .dots:hover .dot.close { color: #730E12; }
  .dot:active { filter: brightness(.85); }

  /* ---- macro grid ---- */
  main { flex: 1; padding: 3px 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .06),
                inset 0 1px 0 rgba(255, 255, 255, .9);
    height: 66px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    cursor: pointer;
    transition: transform .14s cubic-bezier(.2, .7, .3, 1.2),
                border-color .14s, box-shadow .14s;
    opacity: 0; animation: rise .34s ease both;
  }
  .card:hover {
    border-color: var(--line-strong);
    box-shadow: 0 2px 3px rgba(0, 0, 0, .05), 0 8px 22px rgba(0, 0, 0, .10),
                inset 0 1px 0 rgba(255, 255, 255, .9);
    transform: translateY(-1px);
  }
  .card:active { transform: scale(.965); }
  .card svg { width: 20px; height: 20px; stroke: var(--ink); }
  .card .label {
    font-size: 10.5px; font-weight: 590; letter-spacing: -.1px;
    text-align: center; line-height: 1.25; color: var(--ink);
  }
  .slot {
    border: 1px dashed rgba(0, 0, 0, .17);
    border-radius: 11px; height: 66px;
    background: rgba(255, 255, 255, .60);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 300; color: rgba(0, 0, 0, .32);
    opacity: 0; animation: rise .34s ease both;
  }
  body.busy .card { pointer-events: none; }
  body.busy .card svg, body.busy .card .label { opacity: .35; }

  /* ---- status + footer ---- */
  #statusRow {
    display: flex; align-items: baseline; gap: 5px;
    padding: 7px 12px 0; min-height: 26px;
  }
  #status { font-size: 10.5px; line-height: 1.35; color: var(--ink); }
  #working { display: none; }
  body.busy #working { display: inline-flex; gap: 2px; }
  #working i {
    width: 3px; height: 3px; border-radius: 50%; background: var(--ink);
    animation: pulse 1s infinite;
  }
  #working i:nth-child(2) { animation-delay: .15s; }
  #working i:nth-child(3) { animation-delay: .3s; }
  footer {
    text-align: center; font-size: 9.5px; color: var(--ink-3);
    padding: 6px 0 8px; letter-spacing: .1px;
  }

  /* ---- tooltip ---- */
  #tip {
    position: fixed; z-index: 10; max-width: 180px;
    background: rgba(247, 247, 248, .98);
    border: 1px solid rgba(0, 0, 0, .18);
    border-radius: 6px; padding: 5px 8px;
    font-size: 10.5px; line-height: 1.4; color: var(--ink);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .16);
    opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  #tip.show { opacity: 1; }

  /* ---- option sheet ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .18);
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  #sheet {
    position: fixed; left: 9px; right: 9px; bottom: 10px; z-index: 5;
    background: rgba(255, 255, 255, .98);
    border: 1px solid rgba(0, 0, 0, .16);
    border-radius: 11px; padding: 6px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .22);
    opacity: 0; pointer-events: none; transform: translateY(10px);
    transition: opacity .16s, transform .16s cubic-bezier(.2, .7, .3, 1.1);
  }
  body.sheet-open #overlay { opacity: 1; pointer-events: auto; }
  body.sheet-open #sheet { opacity: 1; pointer-events: auto; transform: none; }
  #sheetTitle {
    font-size: 10px; font-weight: 600; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .4px; padding: 5px 9px 3px;
  }
  .opt {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 7px 9px; border-radius: 7px; cursor: pointer;
    font-size: 11.5px; color: var(--ink);
  }
  .opt:hover { background: rgba(0, 0, 0, .06); }
  .opt:active { background: rgba(0, 0, 0, .10); }
  .opt .hint { font-size: 10px; color: var(--ink-3); }
  .opt.cancel {
    justify-content: center; font-weight: 600;
    border-top: 1px solid rgba(0, 0, 0, .1);
    border-radius: 0 0 8px 8px; margin-top: 4px;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); }
                    to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <header>
    <div class="drag pywebview-drag-region"><span class="title">CatPad</span></div>
    <div class="dots">
      <span class="dot min" id="btnMin">–</span>
      <span class="dot close" id="btnClose">✕</span>
    </div>
  </header>

  <main><div class="grid" id="grid"></div></main>

  <div id="statusRow">
    <span id="status">Ready — select a node in CATIA, then tap a card.</span>
    <span id="working"><i></i><i></i><i></i></span>
  </div>
  <footer id="footer"></footer>
  <div id="tip"></div>
  <div id="overlay"></div>
  <div id="sheet"><div id="sheetTitle"></div><div id="sheetOpts"></div></div>

<script>
  const ICONS = {
    palette: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 22a10 10 0 1 1 10-10c0 2-1.5 3.5-3.5 3.5H16a2 2 0 0 0-2 2c0 ' +
      '.6.2 1 .5 1.4.3.5.5.9.5 1.6a1.9 1.9 0 0 1-2 1.5Z"/>' +
      '<circle cx="7.5" cy="11.5" r=".7" fill="currentColor"/>' +
      '<circle cx="10.5" cy="7" r=".7" fill="currentColor"/>' +
      '<circle cx="15" cy="7.5" r=".7" fill="currentColor"/>' +
      '<circle cx="17.5" cy="11.5" r=".7" fill="currentColor"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 ' +
      '0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>' +
      '<circle cx="12" cy="13" r="3"/></svg>',
  };
  const SLOT_TIP = 'Free slot — a future macro lands here.';

  const tip = document.getElementById('tip');
  let tipTimer = null;
  function tipBind(el, text) {
    el.addEventListener('mouseenter', () => {
      tipTimer = setTimeout(() => {
        tip.textContent = text;
        tip.classList.add('show');
        const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
        let x = r.left + r.width / 2 - tr.width / 2;
        x = Math.max(6, Math.min(x, innerWidth - tr.width - 6));
        let y = r.bottom + 7;
        if (y + tr.height > innerHeight - 6) y = r.top - tr.height - 7;
        tip.style.left = x + 'px'; tip.style.top = y + 'px';
      }, 420);
    });
    ['mouseleave', 'mousedown'].forEach(ev =>
      el.addEventListener(ev, () => { clearTimeout(tipTimer); tip.classList.remove('show'); }));
  }

  window.CatPad = {
    setStatus(text) { document.getElementById('status').textContent = text; },
    setBusy(on) { document.body.classList.toggle('busy', on); },
  };

  function closeSheet() { document.body.classList.remove('sheet-open'); }
  function openSheet(m) {
    document.getElementById('sheetTitle').textContent = m.sheet_title || m.label.replace('<br>', ' ');
    const box = document.getElementById('sheetOpts');
    box.innerHTML = '';
    m.options.forEach(o => {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = '<span>' + o.label + '</span>' +
        (o.hint ? '<span class="hint">' + o.hint + '</span>' : '');
      row.addEventListener('click', () => {
        closeSheet();
        pywebview.api.run_macro(m.key, o.key);
      });
      box.appendChild(row);
    });
    const cancel = document.createElement('div');
    cancel.className = 'opt cancel';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', closeSheet);
    box.appendChild(cancel);
    document.body.classList.add('sheet-open');
  }
  document.getElementById('overlay').addEventListener('click', closeSheet);

  function render(meta) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const total = Math.max(meta.slots, meta.macros.length);
    for (let i = 0; i < total; i++) {
      const m = meta.macros[i];
      let el;
      if (m) {
        el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = (ICONS[m.icon] || '') +
          '<div class="label">' + m.label + '</div>';
        el.addEventListener('click', () => m.options
          ? openSheet(m) : pywebview.api.run_macro(m.key));
        tipBind(el, m.tip);
      } else {
        el = document.createElement('div');
        el.className = 'slot';
        el.textContent = '+';
        tipBind(el, SLOT_TIP);
      }
      el.style.animationDelay = (60 + i * 45) + 'ms';
      grid.appendChild(el);
    }
    document.getElementById('footer').textContent =
      'CatPad · v' + meta.version + ' · by ' + meta.author;
  }

  document.getElementById('btnMin').addEventListener('click', () => pywebview.api.minimize());
  document.getElementById('btnClose').addEventListener('click', () => pywebview.api.close());

  window.addEventListener('pywebviewready', async () => {
    render(await pywebview.api.get_meta());
  });
</script>
</body>
</html>
